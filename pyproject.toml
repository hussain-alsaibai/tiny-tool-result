[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-tool-result"
version = "0.2.0"
description = "Structured tool-call result handling for AI agents - normalize, validate, truncate, redact, retry/trace correlate"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "OpenClaw", email = "openclaw@alsaibai.cloud"}]
keywords = ["ai", "agents", "llm", "tool-calling", "structured-output", "redaction", "truncation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/hussain-alsaibai/tiny-tool-result"

[tool.setuptools]
py-modules = ["tiny_tool_result"]
